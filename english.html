  <style>
    :root {

      --card:    #ffffff;
      --border:  #e5e7eb;
      --green:   #16a34a;
      --red:     #dc2626;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; }

    .status-bar { display: flex; align-items: center; gap: 8px; padding: 10px 20px; background: var(--card); border-bottom: 1px solid var(--border); width: 100%; max-width: 520px; font-size: 12px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #d1d5db; flex-shrink: 0; }
    .status-dot.ok { background: var(--green); }
    .status-dot.saving { background: #f59e0b; }
    .status-dot.error { background: var(--red); }
    .status-text { color: var(--muted); }
    .status-text.error { color: var(--red); }

    main { width: 100%; max-width: 520px; padding: 24px 20px 40px; display: flex; flex-direction: column; align-items: center; gap: 14px; }

    h1 { font-size: 22px; font-weight: 700; text-align: center; }
    .subtitle { font-size: 13px; color: var(--muted); text-align: center; }

    .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; }
    .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 10px; text-align: center; }
    .stat-num { font-size: 24px; font-weight: 700; color: var(--blue); }
    .stat-lbl { font-size: 11px; color: var(--muted); margin-top: 2px; }

    .progress-wrap { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; width: 100%; }
    .progress-row { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 8px; }
    .progress-bar { height: 8px; background: var(--blue-bg); border-radius: 4px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--blue); border-radius: 4px; transition: width .4s; }

    .session-wrap { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; width: 100%; }
    .session-head { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 10px; }
    .session-row { display: flex; justify-content: space-between; align-items: center; font-size: 14px; padding: 4px 0; }
    .session-cnt { background: var(--blue-bg); color: var(--blue); font-size: 12px; font-weight: 600; border-radius: 20px; padding: 2px 10px; }

    .btn { width: 100%; padding: 13px; border-radius: 12px; font-family: inherit; font-size: 15px; font-weight: 600; border: none; cursor: pointer; transition: opacity .15s, transform .1s; }
    .btn:active { transform: scale(.98); }
    .btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
    .btn-primary { background: var(--blue); color: #fff; }
    .btn-primary:hover:not(:disabled) { opacity: .88; }
    .btn-ghost { background: var(--card); color: var(--text); border: 1.5px solid var(--border); }
    .btn-ghost:hover { background: var(--bg); }

    .card-header { width: 100%; }
    .card-label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 6px; }
    .card-pbar { height: 4px; background: var(--blue-bg); border-radius: 2px; overflow: hidden; }
    .card-pfill { height: 100%; background: var(--blue); border-radius: 2px; transition: width .3s; }

    .flashcard { background: var(--card); border: 1.5px solid var(--border); border-radius: 16px; padding: 28px 24px; width: 100%; display: flex; flex-direction: column; align-items: center; text-align: center; }
    .fc-badge { font-size: 11px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--blue); background: var(--blue-bg); border-radius: 20px; padding: 3px 12px; margin-bottom: 18px; }
    .fc-theme { font-size: 11px; color: var(--muted); background: var(--bg); border: 1px solid var(--border); border-radius: 20px; padding: 2px 10px; margin-bottom: 14px; }
    .fc-word-row { display: flex; align-items: center; gap: 10px; justify-content: center; }
    .fc-main { font-size: 28px; font-weight: 700; letter-spacing: -.5px; }
    .speak-btn { background: none; border: none; font-size: 20px; cursor: pointer; padding: 4px; border-radius: 8px; transition: background .15s, transform .1s; line-height: 1; }
    .speak-btn:hover { background: var(--blue-bg); }
    .speak-btn.active { transform: scale(1.2); }
    .fc-divider { width: 40px; height: 2px; background: var(--border); border-radius: 1px; margin: 18px 0 14px; }
    .fc-translation { font-size: 20px; font-weight: 600; color: var(--blue); }
    .fc-example { background: var(--blue-bg); border-left: 3px solid var(--blue); border-radius: 8px; padding: 12px 14px; margin-top: 18px; text-align: left; width: 100%; }
    .fc-example-en { font-size: 14px; font-weight: 500; color: var(--text); line-height: 1.5; }

    .choices { display: flex; flex-direction: column; gap: 10px; width: 100%; }
    .choice { background: var(--card); border: 1.5px solid var(--border); border-radius: 12px; padding: 13px 16px; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer; text-align: left; transition: border-color .15s, background .15s; }
    .choice:hover:not(:disabled) { border-color: var(--blue); background: var(--blue-bg); }
    .choice.correct { border-color: var(--green); background: #f0fdf4; color: var(--green); }
    .choice.wrong { border-color: var(--red); background: #fef2f2; color: var(--red); }

    .done-card { background: var(--card); border: 1.5px solid var(--border); border-radius: 16px; padding: 28px 24px; width: 100%; text-align: center; }
    .done-icon { font-size: 48px; margin-bottom: 12px; }
    .done-title { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
    .done-sub { font-size: 14px; color: var(--muted); line-height: 1.5; }

    .token-screen { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none; align-items: center; justify-content: center; z-index: 100; }
    .token-box { background: var(--card); border-radius: 16px; padding: 28px 24px; width: 90%; max-width: 400px; display: flex; flex-direction: column; gap: 14px; }
    .token-box h2 { font-size: 18px; font-weight: 700; }
    .token-box p { font-size: 13px; color: var(--muted); line-height: 1.5; }
    .token-input { border: 1.5px solid var(--border); border-radius: 10px; padding: 11px 14px; font-family: inherit; font-size: 14px; outline: none; }
    .token-input:focus { border-color: var(--blue); }
  </style>
</head>

function getToday() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function daysBetween(a, b) {
  return Math.round((new Date(b) - new Date(a)) / 86400000);
}
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length-1; i > 0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function wordById(id) { return WORDS.find(w => w.id === id); }
function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

const BATCH_SIZE = 10;
const REVIEW_DAYS = [2, 3, 7];

function getAvailableIds(today) {
  if (!state.startDate) return [];
  const d = daysBetween(state.startDate, today);
  const count = Math.min((d + 1) * BATCH_SIZE, WORDS.length);
  return WORDS.slice(0, count).map(w => w.id);
}
function getNewWords(today) {
  return getAvailableIds(today).filter(id => !state.cards[id]);
}
function getReviews(today) {
  const due = [];
  for (const [sid, card] of Object.entries(state.cards)) {
    const id = parseInt(sid);
    if (card.mastered) continue;
    const diff = daysBetween(card.learnedAt, today);
    const reviews = card.reviews || [false,false,false];
    for (let i = 0; i < REVIEW_DAYS.length; i++) {
      if (!reviews[i] && diff >= REVIEW_DAYS[i]) { due.push({id, slot: i}); break; }
    }
  }
  return due;
}
function buildChoices(wordId) {
  const correct = wordById(wordId).ru;
  const pool = WORDS.filter(w => w.id !== wordId && w.ru !== correct);
  return shuffle([correct, ...shuffle(pool).slice(0,3).map(w => w.ru)]);
}

let state = { startDate: null, cards: {} };
let fileSha = null;
let saveTimer = null;

function setStatus(s, t) {
  document.getElementById('statusDot').className = 'status-dot ' + (s||'');
  const span = document.getElementById('statusText');
  span.className = 'status-text' + (s==='error'?' error':'');
  span.textContent = t;
}
function apiHeaders() {
  return { Authorization: `token ${TOKEN}`, Accept: 'application/vnd.github.v3+json', 'Content-Type': 'application/json' };
}
async function loadFromGitHub() {
  const r = await fetch(API, {headers: apiHeaders()});
  if (r.status === 404) return {startDate: null, cards: {}};
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  const json = await r.json();
  fileSha = json.sha;
  return JSON.parse(decodeURIComponent(escape(atob(json.content.replace(/\n/g,'')))));
}
async function saveToGitHub() {
  const content = btoa(unescape(encodeURIComponent(JSON.stringify(state))));
  const body = {message: 'Update English progress', content};
  if (fileSha) body.sha = fileSha;
  const r = await fetch(API, {method:'PUT', headers: apiHeaders(), body: JSON.stringify(body)});
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  fileSha = (await r.json()).content.sha;
}
function scheduleSave() {
  setStatus('saving', 'Сохраняется…');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try { await saveToGitHub(); setStatus('ok', 'Сохранено'); }
    catch(e) { setStatus('error', 'Ошибка сохранения'); }
  }, 1500);
}

let session = null;
const RU_MON_G = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];

function getNextSessionDate() {
  for (let i = 1; i <= 30; i++) {
    const d = new Date(); d.setDate(d.getDate() + i);
    const ds = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    if (getNewWords(ds).length > 0 || getReviews(ds).length > 0) {
      const label = i === 1 ? 'завтра' : `${d.getDate()} ${RU_MON_G[d.getMonth()]}`;
      return { days: i, label };
    }
  }
  return null;
}
function buildSession(today) {
  const newW = getNewWords(today), revs = getReviews(today);
  if (!newW.length && !revs.length) return null;
  return {
    queue: [...newW.map(id=>({type:'new',id})), ...revs.map(({id,slot})=>({type:'review',id,slot}))],
    index: 0, revealed: false, answered: null, choices: null, retried: {}
  };
}
function buildFreeSession() {
  const ids = shuffle(Object.keys(state.cards).map(Number)).slice(0,10);
  return { free:true, queue: ids.map(id=>({type:'review',id,slot:0})), index:0, answered:null, choices:null, retried:{} };
}
function currentItem() {
  return session && session.index < session.queue.length ? session.queue[session.index] : null;
}

const root = document.getElementById('root');

function render() {
  if (!state.startDate) { renderWelcome(); return; }
  if (!session) { renderHome(); return; }
  const item = currentItem();
  if (!item) { const wasFree = session.free; session = null; renderDone(wasFree); return; }
  item.type === 'new' ? renderLearn(item) : renderReview(item);
}

function renderWelcome() {
  root.innerHTML = `
    <h1>Английский словарь B2</h1>
    <p class="subtitle">${WORDS.length} слов · 10 новых слов каждый день · повторения через 2, 3 и 7 дней</p>
    <div class="done-card" style="margin-bottom:20px">
      <div class="done-icon">🇺🇸</div>
      <div class="done-title">Начнём учить?</div>
      <div class="done-sub">Каждый день 10 новых слов. После каждого слова — пример из реальной жизни.</div>
    </div>
    <button class="btn btn-primary" id="btnStart">Начать обучение</button>`;
  document.getElementById('btnStart').onclick = () => {
    state.startDate = getToday();
    session = buildSession(state.startDate);
    scheduleSave();
    render();
  };
}

function renderHome() {
  const today = getToday();
  const newW = getNewWords(today), revs = getReviews(today);
  const totalLearned = Object.keys(state.cards).length;
  const mastered = Object.values(state.cards).filter(c => c.mastered).length;
  const pct = Math.round(totalLearned / WORDS.length * 100);
  const hasSession = newW.length > 0 || revs.length > 0;
  root.innerHTML = `
    <h1>Английский словарь B2</h1>
    <p class="subtitle">Прогресс на сегодня</p>
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-num">${totalLearned}</div><div class="stat-lbl">изучено</div></div>
      <div class="stat-card"><div class="stat-num">${mastered}</div><div class="stat-lbl">выучено</div></div>
      <div class="stat-card"><div class="stat-num">${WORDS.length - totalLearned}</div><div class="stat-lbl">осталось</div></div>
    </div>
    <div class="progress-wrap">
      <div class="progress-row"><span>Общий прогресс</span><span>${pct}%</span></div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    </div>
    <div class="session-wrap">
      <div class="session-head">Сегодня</div>
      ${newW.length ? `<div class="session-row">📖 Новые слова<span class="session-cnt">${newW.length}</span></div>` : ''}
      ${revs.length ? `<div class="session-row">🔄 Повторение<span class="session-cnt">${revs.length}</span></div>` : ''}
      ${!hasSession ? (() => {
        const next = getNextSessionDate();
        return `<div style="text-align:center;font-size:14px;color:var(--muted);padding:8px 0">
          ✅ На сегодня всё готово${next ? `<br><span style="font-size:12px">Следующая сессия — ${next.label}</span>` : ''}
        </div>`;
      })() : ''}
    </div>
    <button class="btn btn-primary" id="btnSession" ${!hasSession?'disabled':''}>
      ${hasSession ? 'Начать сессию' : (() => { const n=getNextSessionDate(); return n?`Вернись ${n.label}`:"Готово"; })()}
    </button>
    ${totalLearned > 0 ? `<button class="btn btn-ghost" id="btnFree">🔁 Свободное повторение</button>` : ''}`;
  if (hasSession) document.getElementById('btnSession').onclick = () => { session = buildSession(today); render(); };
  document.getElementById('btnFree')?.addEventListener('click', () => { session = buildFreeSession(); render(); });
}

function exampleBlock(word) {
  return `<div class="fc-example"><div class="fc-example-en">${esc(word.ex)}</div></div>`;
}

function renderLearn(item) {
  const word = wordById(item.id);
  const total = session.queue.filter(i=>i.type==='new').length;
  const done  = session.queue.slice(0,session.index).filter(i=>i.type==='new').length;
  const pct   = total ? Math.round(done/total*100) : 0;

  root.innerHTML = `
    <div class="card-header">
      <span class="card-label">Новое слово · ${done+1} / ${total}</span>
      <div class="card-pbar"><div class="card-pfill" style="width:${pct}%"></div></div>
    </div>
    <div class="flashcard" id="fc">
      <div class="fc-badge">Английский → Русский</div>
      <div class="fc-theme">${esc(word.theme)}</div>
      <div class="fc-word-row">
        <div class="fc-main">${esc(word.en)}</div>
        <button class="speak-btn" id="speakBtn" title="Произнести">🔊</button>
      </div>
      <div class="fc-divider" id="div" style="${session.revealed?'':' display:none'}"></div>
      <div class="fc-translation" id="tr">${session.revealed ? esc(word.ru) : ''}</div>
      <div id="exBlock">${session.revealed ? exampleBlock(word) : ''}</div>
    </div>
    <button class="btn btn-primary" id="btnReveal" style="${session.revealed?'display:none':''}">Показать перевод</button>
    <button class="btn btn-primary" id="btnLearned" style="${session.revealed?'':' display:none'}">Выучил! →</button>`;

  document.getElementById('speakBtn').addEventListener('click', () => {
    speak(word.en);
    const btn = document.getElementById('speakBtn');
    btn.classList.add('active');
    setTimeout(() => btn.classList.remove('active'), 600);
  });
  document.getElementById('btnReveal')?.addEventListener('click', () => {
    session.revealed = true;
    document.getElementById('tr').textContent = word.ru;
    document.getElementById('div').style.display = 'block';
    document.getElementById('exBlock').innerHTML = exampleBlock(word);
    document.getElementById('btnReveal').style.display = 'none';
    document.getElementById('btnLearned').style.display = 'block';
  });
  document.getElementById('btnLearned')?.addEventListener('click', () => {
    state.cards[item.id] = {learnedAt: getToday(), reviews: [false,false,false], mastered: false};
    scheduleSave();
    session.index++;
    session.revealed = false;
    render();
  });
}

function renderReview(item) {
  const word = wordById(item.id);
  if (!session.choices) session.choices = buildChoices(item.id);
  const choices = session.choices, answered = session.answered;
  const total = session.queue.filter(i=>i.type==='review').length;
  const done  = session.queue.slice(0,session.index).filter(i=>i.type==='review').length;
  const pct   = total ? Math.round(done/total*100) : 0;
  const correct = answered === word.ru;
  const modeLabel = session.free ? 'Тренировка' : 'Повторение';

  root.innerHTML = `
    <div class="card-header">
      <span class="card-label">${modeLabel} · ${done+1} / ${total}</span>
      <div class="card-pbar"><div class="card-pfill" style="width:${pct}%"></div></div>
    </div>
    <div class="flashcard">
      <div class="fc-badge">Что значит это слово?</div>
      <div class="fc-theme">${esc(word.theme)}</div>
      <div class="fc-word-row">
        <div class="fc-main">${esc(word.en)}</div>
        <button class="speak-btn" id="speakBtn" title="Произнести">🔊</button>
      </div>
      ${answered && correct ? exampleBlock(word) : ''}
    </div>
    <div class="choices">
      ${choices.map(c => {
        let cls = '';
        if (answered) {
          if (c === word.ru) cls = 'correct';
          else if (c === answered && !correct) cls = 'wrong';
        }
        return `<button class="choice ${cls}" data-val="${esc(c)}" ${answered?'disabled':''}>  ${esc(c)}</button>`;
      }).join('')}
    </div>
    <button class="btn btn-primary" id="btnNext" style="${answered?'':' display:none'}">Далее →</button>`;

  document.getElementById('speakBtn').addEventListener('click', () => {
    speak(word.en);
    const btn = document.getElementById('speakBtn');
    btn.classList.add('active');
    setTimeout(() => btn.classList.remove('active'), 600);
  });
  if (!answered) {
    document.querySelectorAll('.choice').forEach(btn => {
      btn.addEventListener('click', () => {
        const val = btn.dataset.val;
        session.answered = val;
        if (val === word.ru) {
          if (!session.free) {
            const reviews = state.cards[item.id].reviews;
            reviews[item.slot] = true;
            if (reviews.every(Boolean)) state.cards[item.id].mastered = true;
            scheduleSave();
          }
        } else {
          if (!session.retried[item.id+'_'+item.slot]) {
            session.retried[item.id+'_'+item.slot] = true;
            session.queue.push({type:'review', id:item.id, slot:item.slot});
          }
        }
        render();
      });
    });
  } else {
    document.getElementById('btnNext').addEventListener('click', () => {
      session.index++;
      session.answered = null;
      session.choices = null;
      render();
    });
  }
}

function renderDone(isFree = false) {
  root.innerHTML = `
    <div class="done-card">
      <div class="done-icon">${isFree ? '✨' : '🎉'}</div>
      <div class="done-title">${isFree ? 'Тренировка завершена!' : 'Сессия завершена!'}</div>
      <div class="done-sub">${isFree ? 'Хорошая тренировка! Можно запустить ещё раз.' : 'Отличная работа. Возвращайся завтра — прогресс сохранён.'}</div>
    </div>
    ${isFree ? `<button class="btn btn-primary" id="btnAgain" style="margin-top:16px">🔁 Ещё раз</button>` : ''}
    <button class="btn btn-ghost" id="btnHome" style="margin-top:${isFree?'10':'16'}px">← На главную</button>`;
  document.getElementById('btnHome').onclick = render;
  document.getElementById('btnAgain')?.addEventListener('click', () => { session = buildFreeSession(); render(); });
}

let _audio = null;
function speak(text) {
  if (_audio) { _audio.pause(); _audio = null; }
  const url = `https://translate.googleapis.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(text)}&tl=en&client=tw-ob`;
  _audio = new Audio(url);
  _audio.play().catch(() => {});
}

function showTokenScreen() {
  document.getElementById('tokenScreen').style.display = 'flex';
  function save() {
    const val = document.getElementById('tokenInput').value.trim();
    if (!val) return;
    localStorage.setItem(TOKEN_KEY, val);
    location.reload();
  }
  document.getElementById('tokenSaveBtn').addEventListener('click', save);
  document.getElementById('tokenInput').addEventListener('keydown', e => { if(e.key==='Enter') save(); });
}

async function init() {
  if (!TOKEN) { showTokenScreen(); return; }
  try {
    state = await loadFromGitHub();
    if (!state.cards) state.cards = {};
    setStatus('ok', 'Сохранено');
  } catch(e) {
    if (e.message.includes('401') || e.message.includes('403')) { showTokenScreen(); return; }
    console.error(e);
    setStatus('error', 'Ошибка загрузки');
  }
  render();
}
init();
</script>
</body>
</html>
