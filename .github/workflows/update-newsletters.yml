name: Update newsletter archive

on:
  schedule:
    - cron: '0 5 * * 1'   # Mondays ~05:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Refresh newsletter archive
        env:
          MAILCHIMP_API_KEY: ${{ secrets.MAILCHIMP_API_KEY }}
        run: python3 scripts/update_newsletters.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- about.html; then
            echo "No changes to newsletter archive"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add about.html
          git commit -m "Auto-update newsletter archive"
          git push
