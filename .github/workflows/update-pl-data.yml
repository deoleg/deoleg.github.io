name: Update Premier League data

on:
  schedule:
    # Target ~07:00 Europe/Chisinau daily. GitHub Actions cron is fixed UTC and
    # doesn't follow DST, so two entries approximate it year-round:
    # Mar–Oct (EEST, UTC+3) -> 04:00 UTC; Nov–Feb (EET, UTC+2) -> 05:00 UTC.
    # Off by up to a few days right at the DST switchover — not worth more precision.
    - cron: '0 4 * 3-10 *'
    - cron: '0 5 * 11,12,1,2 *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Refresh PL data
        run: python3 scripts/update_pl_data.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- data/pl.json data/pl-results.json; then
            echo "No changes to PL data"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/pl.json data/pl-results.json
          git commit -m "Auto-update Premier League data"
          git push
