name: Update Premier League data

on:
  schedule:
    # 05:00 UTC daily — after evening kick-offs in Europe have finished.
    - cron: '0 5 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh data/pl.json
        run: python3 scripts/update_pl_data.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- data/pl.json; then
            echo "No changes to data/pl.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/pl.json
          git commit -m "Auto-update Premier League data"
          git push
