<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Английская Премьер-лига</title>

  <link rel="icon" type="image/png" href="assets/images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: #f9f9f9;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px 64px;
    }

    .page { width: 100%; max-width: 900px; }

    header.top { margin-bottom: 28px; }
    header.top h1 { font-size: 22px; font-weight: 700; }
    header.top .meta { font-size: 12.5px; color: #999; margin-top: 4px; }

    .card {
      background: #fff;
      border: 1.5px solid #e5e5e5;
      border-radius: 12px;
      padding: 20px 22px;
      margin-bottom: 24px;
    }

    .card h2 {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card h2 .tag {
      font-size: 11px;
      font-weight: 500;
      color: #999;
      background: #f4f4f2;
      padding: 2px 8px;
      border-radius: 20px;
    }

    /* ── Standings table ── */
    table.standings { width: 100%; border-collapse: collapse; font-size: 13px; }
    table.standings th {
      text-align: left;
      font-weight: 500;
      color: #999;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .03em;
      padding: 0 6px 8px;
      border-bottom: 1.5px solid #eee;
    }
    table.standings th.num, table.standings td.num { text-align: center; width: 30px; }
    table.standings td { padding: 7px 6px; border-bottom: 1px solid #f2f2f2; }
    table.standings tr:last-child td { border-bottom: none; }
    table.standings tr.zone-cl td:first-child { box-shadow: inset 3px 0 0 #1e63c9; }
    table.standings tr.zone-el td:first-child { box-shadow: inset 3px 0 0 #e08a1e; }
    table.standings tr.zone-relegation td:first-child { box-shadow: inset 3px 0 0 #e05252; }
    table.standings td.pos { font-weight: 600; color: #555; padding-left: 12px; }
    table.standings td.team { font-weight: 500; }
    table.standings td.pts { font-weight: 700; }
    .crest { width: 18px; height: 18px; object-fit: contain; vertical-align: middle; margin-right: 8px; }
    .team-cell { display: flex; align-items: center; }
    .legend { display: flex; gap: 16px; margin-top: 14px; font-size: 11.5px; color: #888; flex-wrap: wrap; }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .legend i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
    .legend .cl i { background: #1e63c9; }
    .legend .el i { background: #e08a1e; }
    .legend .rel i { background: #e05252; }

    /* ── Fixtures ── */
    .fixture-list { display: flex; flex-direction: column; gap: 8px; }
    .fixture {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border: 1px solid #eee;
      border-radius: 8px;
      font-size: 13px;
    }
    .fixture .when {
      width: 150px;
      flex-shrink: 0;
      color: #888;
      font-size: 12px;
    }
    .fixture .matchup {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-weight: 500;
    }
    .fixture .matchup .side { display: flex; align-items: center; gap: 6px; }
    .fixture .matchup .side.away { flex-direction: row-reverse; }
    .fixture .vs { color: #bbb; font-weight: 400; font-size: 12px; }
    .fixture .ground { width: 150px; flex-shrink: 0; text-align: right; color: #aaa; font-size: 11.5px; }

    @media (max-width: 640px) {
      .fixture { flex-wrap: wrap; }
      .fixture .when, .fixture .ground { width: auto; }
      .fixture .ground { display: none; }
      .fixture .matchup { width: 100%; order: 2; }
    }

    /* ── Facts ── */
    .facts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 12px;
    }
    .fact-card {
      border: 1px solid #eee;
      border-radius: 10px;
      padding: 12px 14px;
      background: #fcfcfb;
    }
    .fact-card .fact-team { font-size: 11px; color: #999; text-transform: uppercase; letter-spacing: .03em; margin-bottom: 4px; }
    .fact-card .fact-player { font-size: 14.5px; font-weight: 600; margin-bottom: 4px; }
    .fact-card .fact-bio { font-size: 12px; color: #888; margin-bottom: 6px; }
    .fact-card .fact-note { font-size: 12.5px; color: #1D9E75; font-weight: 500; }

    /* ── Calendar ── */
    .calendar-wrap iframe {
      width: 100%;
      height: 480px;
      border: 1px solid #eee;
      border-radius: 8px;
    }

    .empty { color: #aaa; font-size: 13px; padding: 8px 0; }
    .loading { color: #aaa; font-size: 13px; }
  </style>
</head>
<body>

<div class="page">
  <header class="top">
    <h1>⚽ Английская Премьер-лига</h1>
    <div class="meta" id="meta">Загрузка…</div>
  </header>

  <div class="card">
    <h2>Таблица <span class="tag" id="season-tag"></span></h2>
    <table class="standings" id="standings-table">
      <thead>
        <tr>
          <th class="num">#</th>
          <th>Команда</th>
          <th class="num">И</th>
          <th class="num">В</th>
          <th class="num">Н</th>
          <th class="num">П</th>
          <th class="num">РМ</th>
          <th class="num">О</th>
        </tr>
      </thead>
      <tbody id="standings-body"></tbody>
    </table>
    <div class="legend">
      <span class="cl"><i></i>Лига чемпионов</span>
      <span class="el"><i></i>Лига Европы</span>
      <span class="rel"><i></i>Вылет в Championship</span>
    </div>
  </div>

  <div class="card">
    <h2>Матчи на этой неделе</h2>
    <div class="fixture-list" id="fixtures-list"><div class="loading">Загрузка…</div></div>
  </div>

  <div class="card">
    <h2>Интересные факты об игроках</h2>
    <div class="facts-grid" id="facts-grid"><div class="loading">Загрузка…</div></div>
  </div>

  <div class="card calendar-wrap">
    <h2>Мои матчи в календаре</h2>
    <iframe src="https://calendar.google.com/calendar/embed?src=0063fe07961e08d9ea5f53e6d8a86073f6e343776d1106b98ceb24c522b5c699%40group.calendar.google.com&ctz=Europe%2FChisinau" frameborder="0" scrolling="no"></iframe>
  </div>
</div>

<script>
  const FILE = "data/pl.json";

  function timeAgoLabel(iso) {
    const d = new Date(iso);
    return d.toLocaleString('ru-RU', { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' });
  }

  function zoneClass(q) {
    if (q === 'EU_CL') return 'zone-cl';
    if (q === 'EU_EL') return 'zone-el';
    if (q === 'EN_CH') return 'zone-relegation';
    return '';
  }

  function crestUrl(code) {
    return code ? `https://resources.premierleague.com/premierleague/badges/50/${code}.png` : '';
  }

  function renderStandings(rows) {
    const body = document.getElementById('standings-body');
    body.innerHTML = rows.map(r => `
      <tr class="${zoneClass(r.qualification)}">
        <td class="pos">${r.position}</td>
        <td class="team">
          <span class="team-cell">
            <img class="crest" src="${crestUrl(r.crest)}" alt="" onerror="this.style.display='none'">
            ${r.team}
          </span>
        </td>
        <td class="num">${r.played}</td>
        <td class="num">${r.won}</td>
        <td class="num">${r.drawn}</td>
        <td class="num">${r.lost}</td>
        <td class="num">${r.gd > 0 ? '+' + r.gd : r.gd}</td>
        <td class="num pts">${r.points}</td>
      </tr>
    `).join('');
  }

  function renderFixtures(fixtures) {
    const list = document.getElementById('fixtures-list');
    if (!fixtures.length) {
      list.innerHTML = '<div class="empty">На этой неделе матчей не найдено.</div>';
      return;
    }
    list.innerHTML = fixtures.map(f => `
      <div class="fixture">
        <div class="when">${f.kickoffLabel}</div>
        <div class="matchup">
          <span class="side home"><img class="crest" src="${crestUrl(f.homeCrest)}" alt="" onerror="this.style.display='none'">${f.home}</span>
          <span class="vs">—</span>
          <span class="side away"><img class="crest" src="${crestUrl(f.awayCrest)}" alt="" onerror="this.style.display='none'">${f.away}</span>
        </div>
        <div class="ground">${f.ground || ''}</div>
      </div>
    `).join('');
  }

  function renderFacts(facts) {
    const grid = document.getElementById('facts-grid');
    if (!facts.length) {
      grid.innerHTML = '<div class="empty">Пока нет данных для фактов на эту неделю.</div>';
      return;
    }
    grid.innerHTML = facts.map(f => `
      <div class="fact-card">
        <div class="fact-team">${f.team}</div>
        <div class="fact-player">${f.player}</div>
        <div class="fact-bio">${f.position}${f.nationality ? ', ' + f.nationality : ''}${f.age ? ', ' + f.age + ' лет' : ''}</div>
        <div class="fact-note">${f.note}</div>
      </div>
    `).join('');
  }

  fetch(FILE + '?v=' + Date.now())
    .then(r => r.json())
    .then(data => {
      document.getElementById('season-tag').textContent = data.season.replace('English Premier League Season ', '');
      document.getElementById('meta').textContent = 'Обновлено: ' + timeAgoLabel(data.updatedAt);
      renderStandings(data.standings);
      renderFixtures(data.fixtures);
      renderFacts(data.facts);
    })
    .catch(err => {
      document.getElementById('meta').textContent = 'Не удалось загрузить данные';
      console.error(err);
    });
</script>

</body>
</html>
