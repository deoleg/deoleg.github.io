<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light only">
<title>Подготовка к поездке</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;650;750&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F6F2; --surface:#FFFFFF; --ink:#18212B; --muted:#5B6672; --line:#D9DDD6;
  --accent:#0B4EA2; --accent-ink:#FFFFFF; --gold:#E9B400; --open:#A86200; --open-bg:#FFF3DF;
  --done:#2E7D4F; --done-bg:#E6F3EB; --no:#A23B2E;
  --ui:"Onest", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --serif:"Literata", Georgia, "Times New Roman", serif;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--ui);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:780px;margin:0 auto;padding:0 18px}

/* Lock screen */
.lock{min-height:100vh;display:grid;place-items:center;padding:24px}
.lock form{width:100%;max-width:360px}
.lock h1{font-size:26px;line-height:1.2;font-weight:750;margin:0 0 6px}
.lock p{color:var(--muted);margin:0 0 20px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field span{font-size:14px;color:var(--muted)}
input[type=text],input[type=password],input[type=date],input[type=time],select,textarea{
  width:100%;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
textarea{min-height:70px;resize:vertical}
.check-inline{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted);margin:4px 0 16px}
.btn{text-decoration:none;display:inline-block;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:5px 10px;font-size:14px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.err{color:var(--no);font-size:14px;min-height:20px}

/* Header + route */
header.top{padding:28px 0 8px}
header.top h1{font-size:30px;line-height:1.15;font-weight:750;letter-spacing:-.01em;margin:0}
header.top .sub{color:var(--muted);margin-top:4px}
.route{margin:22px -18px 6px;padding:6px 18px 14px;overflow-x:auto;scrollbar-width:none}
.route::-webkit-scrollbar{display:none}
.route ol{list-style:none;margin:0;padding:0;display:flex;min-width:640px;position:relative}
.route ol::before{content:"";position:absolute;left:12px;right:12px;top:11px;border-top:3px solid var(--ink);opacity:.85}
.route li{flex:1;position:relative;padding-top:32px;padding-right:8px}
.route li::before{content:"";position:absolute;left:2px;top:1px;width:20px;height:20px;border-radius:50%;
  background:var(--gold);border:3px solid var(--ink)}
.route li.unset::before{background:var(--bg);border:3px dashed var(--open)}
.route li.home::before{background:var(--ink)}
.route .stop{font-weight:650;line-height:1.2}
.route .when{font-size:14px;color:var(--muted)}
.route li.unset .when{color:var(--open);font-weight:500}
.route .tz{font-size:13px;color:var(--muted)}
.count{display:flex;flex-wrap:wrap;gap:8px 22px;margin:8px 0 4px;font-size:15px}
.count b{font-weight:750;font-size:20px;margin-right:4px}
.count .past{color:var(--muted);text-decoration:line-through}

/* Tabs */
nav.tabs{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin-top:14px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-top:env(safe-area-inset-top,0px)}
nav.tabs .wrap::-webkit-scrollbar{display:none}
nav.tabs button{border:0;background:none;padding:13px 10px 11px;border-bottom:3px solid transparent;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
nav.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs .badge{display:inline-block;min-width:20px;padding:0 6px;margin-left:4px;border-radius:10px;background:var(--open-bg);color:var(--open);font-size:12px;font-weight:650;line-height:20px;text-align:center}

main{padding:22px 0 60px}
section.view{display:none}
section.view.on{display:block}
h2{font-size:21px;line-height:1.25;font-weight:750;margin:30px 0 10px}
h2:first-child{margin-top:4px}
h3{font-size:17px;font-weight:650;margin:22px 0 8px}
.hint{color:var(--muted);font-size:14px;margin:-4px 0 12px}

/* Open issues */
.issues{list-style:none;margin:0 0 8px;padding:0;border-left:3px solid var(--open);background:var(--open-bg);border-radius:0 8px 8px 0}
.issues li{padding:8px 14px;color:var(--ink)}
.issues li+li{border-top:1px solid color-mix(in srgb,var(--open) 22%,transparent)}
.issues.clear{border-left-color:var(--done);background:var(--done-bg)}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
.regblock{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.regblock .name{font-weight:650;margin-bottom:6px}

/* Row lists */
.rows{display:flex;flex-direction:column;gap:8px}
.row{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.row .rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.row .foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:8px}
.row .calc{font-size:14px;color:var(--muted)}
.row.s-yes{border-left:4px solid var(--done)}
.row.s-no{border-left:4px solid var(--no);opacity:.8}
.row.s-asked,.row.s-idea{border-left:4px solid var(--open)}
.addbar{margin-top:8px}
.meter{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:4px 0 2px}
.meter i{display:block;height:100%;background:var(--accent)}
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:14px}
.meters .lbl{font-size:14px;display:flex;justify-content:space-between}

/* Checklist */
.group{margin-bottom:22px}
.group .ghead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.group .ghead h3{margin:0 0 6px}
.group .ghead span{font-size:14px;color:var(--muted);white-space:nowrap}
.items{list-style:none;margin:0;padding:0}
.items li{border-top:1px solid var(--line)}
.items label{display:flex;gap:12px;padding:10px 2px;cursor:pointer;align-items:flex-start}
.items input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--done)}
.items input:checked+span{color:var(--muted);text-decoration:line-through}

/* Partners */
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px}
.pcard .ph{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.pcard .pn{font-weight:650;font-size:17px}
.pcard .pp{color:var(--muted);font-size:14px}
.pcard .hist{margin:8px 0;font-size:15px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.tag{font-size:13px;border:1px solid var(--line);border-radius:12px;padding:1px 9px}
.steps{display:flex;gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;width:max-content;max-width:100%;flex-wrap:wrap}
.steps button{border:0;background:var(--surface);padding:6px 11px;font-size:14px;cursor:pointer;border-right:1px solid var(--line)}
.steps button:last-child{border-right:0}
.steps button.on{background:var(--accent);color:var(--accent-ink);font-weight:650}
.replies{margin:0 0 12px;display:flex;flex-direction:column;gap:6px}
.reply{border-left:3px solid var(--done);background:var(--done-bg);border-radius:0 8px 8px 0;padding:8px 12px;font-size:15px}
.reply .rd{display:block;font-size:13px;color:var(--muted);margin-bottom:2px}
.wave2{list-style:none;padding:0;margin:0}
.wave2 li{padding:9px 0;border-top:1px solid var(--line)}
.wave2 .pp{color:var(--muted);font-size:14px}

/* Letters */
.lpick{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.lpick button{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:5px 12px;cursor:pointer;font-size:14px}
.lpick button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.letter{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:22px 22px 26px;font:400 16.5px/1.65 var(--serif);white-space:pre-wrap;max-width:68ch}
.letter .subj{font:600 15px/1.4 var(--ui);color:var(--muted);margin-bottom:14px;white-space:normal}
.letter mark{background:var(--open-bg);color:var(--open);font-family:var(--ui);font-size:14px;padding:1px 4px;border-radius:3px}
.lactions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.note-sample{border-left:3px solid var(--line);padding:4px 14px;font-family:var(--serif);color:var(--muted)}

/* Advice */
.advice{list-style:none;padding:0;margin:0}
.advice li{padding:12px 0;border-top:1px solid var(--line)}
.advice b{display:block;font-weight:650;margin-bottom:2px}

/* Presentation */
.pr-items{list-style:none;margin:0;padding:0;counter-reset:sl}
.pr-slide{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px 16px;margin:0 0 12px}
.pr-slide h3{margin:0;font-size:17px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.pr-slide h3 .n{color:var(--muted);font-weight:500;font-size:14px}
.pr-goal{color:var(--muted);font-size:14.5px;margin:2px 0 12px}
.pr-cols{display:grid;grid-template-columns:1fr 1.4fr;gap:14px}
.pr-cols h4{margin:0 0 4px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:650}
.pr-screen{white-space:pre-wrap}
.pr-say{white-space:pre-wrap;font:400 16.5px/1.65 var(--serif)}
.pr-empty{color:var(--muted);font-style:italic;font-family:var(--ui);font-size:14.5px}
.pr-note{margin-top:10px;font-size:14px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
.pr-step{padding:10px 2px 12px 14px;margin:0 0 12px;border-left:3px solid var(--line)}
.pr-step b{font-weight:650}
.pr-step .pr-goal{margin:2px 0 4px}
.pr-bl{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pr-bl button{font-size:13px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:2px 10px;cursor:pointer;color:var(--accent)}
.pr-st{font-size:12px;border-radius:10px;padding:1px 8px;border:1px solid var(--line);color:var(--muted);font-weight:500}
.pr-st.draft{color:var(--open);background:var(--open-bg);border-color:transparent}
.pr-st.ready{color:var(--done);background:var(--done-bg);border-color:transparent}
@media (max-width:640px){ .pr-cols{grid-template-columns:1fr} }

/* Learn (blurbs) */
.bl-list{list-style:none;margin:0 0 6px;padding:0}
.bl-list li{border-top:1px solid var(--line)}
.bl-list button{width:100%;text-align:left;background:none;border:0;padding:12px 2px;cursor:pointer;display:flex;justify-content:space-between;gap:12px;align-items:center}
.bl-list .t{font-weight:500}
.bl-list .pct{font-size:14px;color:var(--muted);white-space:nowrap}
.bl-list .bar{display:block;height:4px;background:var(--line);border-radius:2px;margin-top:6px;overflow:hidden;width:100%}
.bl-list .bar i{display:block;height:100%;background:var(--done)}
.bl-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.bl-head h2{margin:0}
.bl-note{color:var(--muted);font-size:15px;margin:4px 0 14px;max-width:68ch}
.bl-text{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:20px 22px;font:400 18px/1.85 var(--serif);max-width:68ch}
.bl-text p{margin:0 0 14px}.bl-text p:last-child{margin:0}
.ck{border-radius:4px;transition:background .2s}
.ck.ph{font-family:var(--ui);font-size:15px;color:var(--accent);font-weight:500}
.ck.weak{text-decoration:underline dotted var(--open);text-underline-offset:4px}
.ck.blur{filter:blur(6px);background:color-mix(in srgb,var(--ink) 8%,transparent);cursor:pointer;user-select:none;-webkit-user-select:none}
.ck.blur:focus-visible{outline:2px solid var(--accent);filter:blur(5px)}
.ck.blur.active{outline:2px solid var(--accent)}
.ck.ok{background:var(--done-bg);color:var(--done)}
.ck.bad{background:color-mix(in srgb,var(--no) 14%,transparent);color:var(--no)}
.bl-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}
.bl-score{font-size:15px;color:var(--muted)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -8px 24px rgb(0 0 0 / .12);padding:14px 18px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet .wrap{padding:0}
.sheet .q{font-size:14px;color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between}
.sheet .opts{display:grid;gap:8px}
.sheet .opts button{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 12px;font:400 16px/1.4 var(--serif);cursor:pointer}
.sheet .opts button.right{border-color:var(--done);background:var(--done-bg);color:var(--done)}
.sheet .opts button.wrong{border-color:var(--no);color:var(--no);text-decoration:line-through}
@media (prefers-reduced-motion:reduce){.ck{transition:none}}

footer.tools{border-top:1px solid var(--line);padding:18px 0 40px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--muted);font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div id="lock" class="lock">
  <form id="lockform" autocomplete="off">
    <h1>Подготовка к поездке</h1>
    <p>Страница зашифрована. Введите токен, чтобы открыть её.</p>
    <label class="field"><span>Токен</span><input id="tok" type="password" autocomplete="current-password" required></label>
    <label class="check-inline"><input id="remember" type="checkbox"> Запомнить на этом устройстве</label>
    <button class="btn primary" type="submit">Открыть</button>
    <div class="err" id="lockerr" role="alert"></div>
  </form>
</div>
<div id="app" hidden></div>
<div class="toast" id="toast" role="status"></div>

const TOKEN_KEY = "trip2027:token";
const STATE_KEY = "trip2027:state";

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decrypt(token){
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey("raw", enc.encode(token), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    {name:"PBKDF2", salt:b64(PAYLOAD.salt), iterations:PAYLOAD.iter, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(PAYLOAD.iv)}, key, b64(PAYLOAD.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}
function ls(k, v){ try{ if(v===undefined) return localStorage.getItem(k); if(v===null) localStorage.removeItem(k); else localStorage.setItem(k, v);}catch(e){ return null; } }

async function unlock(token, remember){
  try{
    const data = await decrypt(token);
    if(remember) ls(TOKEN_KEY, token);
    document.getElementById("lock").hidden = true;
    start(data);
    return true;
  }catch(e){ return false; }
}

(async function boot(){
  const m = location.hash.match(/k=([^&]+)/);
  if(m){
    const t = decodeURIComponent(m[1]);
    history.replaceState(null, "", location.pathname + location.search);
    if(await unlock(t, true)) return;
  }
  const saved = ls(TOKEN_KEY);
  if(saved && await unlock(saved, false)) return;
  if(saved) ls(TOKEN_KEY, null);
  document.getElementById("lockform").addEventListener("submit", async e => {
    e.preventDefault();
    const ok = await unlock(document.getElementById("tok").value.trim(), document.getElementById("remember").checked);
    if(!ok) document.getElementById("lockerr").textContent = "Токен не подошёл. Проверьте его и попробуйте ещё раз.";
  });
})();

/* ---------- App ---------- */
let D, S;
const $ = (sel, el=document) => el.querySelector(sel);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Math.random().toString(36).slice(2, 9);

function defaults(){
  return {checks:{}, dates:{}, colleague:{name:"", going:"unknown"}, airport:"",
    housing:[], cars:[], meetings:[], contacts:[], partners:{}, notes:"", learn:{}};
}
function loadState(){
  try{ const s = JSON.parse(ls(STATE_KEY) || "null"); return Object.assign(defaults(), s || {}); }
  catch(e){ return defaults(); }
}
function save(){ ls(STATE_KEY, JSON.stringify(S)); updateBadges(); renderRoute(); }

function toast(t){ const el = $("#toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toast._t); toast._t = setTimeout(()=>el.classList.remove("on"), 1800); }

const ruDate = iso => { if(!iso) return ""; const [y,m,d] = iso.split("-").map(Number); return new Date(Date.UTC(y,m-1,d)).toLocaleDateString("ru-RU",{day:"numeric",month:"short",timeZone:"UTC"}); };
const enDate = iso => { if(!iso) return ""; const [y,m,d] = iso.split("-").map(Number); return new Date(Date.UTC(y,m-1,d)).toLocaleDateString("en-US",{month:"long",day:"numeric",timeZone:"UTC"}); };
const regionName = id => (D.regions.find(r=>r.id===id)||{}).name || "";
const regionTz = id => (D.regions.find(r=>r.id===id)||{}).tz;

/* wall time in a zone -> Chisinau wall time */
function tzOffsetMin(zone, utcMs){
  const f = new Intl.DateTimeFormat("en-US",{timeZone:zone,hourCycle:"h23",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"});
  const p = Object.fromEntries(f.formatToParts(new Date(utcMs)).map(x=>[x.type,x.value]));
  return (Date.UTC(+p.year, +p.month-1, +p.day, +p.hour, +p.minute) - utcMs) / 60000;
}
function toChisinau(dateIso, time, zone){
  if(!dateIso || !time || !zone) return "";
  const [y,m,d] = dateIso.split("-").map(Number), [h,mi] = time.split(":").map(Number);
  let utc = Date.UTC(y,m-1,d,h,mi);
  utc -= tzOffsetMin(zone, utc) * 60000;
  utc = Date.UTC(y,m-1,d,h,mi) - tzOffsetMin(zone, utc) * 60000;
  return new Date(utc).toLocaleString("ru-RU",{timeZone:"Europe/Chisinau",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
}
function daysTo(iso){
  const now = new Date(); const t0 = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
  const [y,m,d] = iso.split("-").map(Number); return Math.round((Date.UTC(y,m-1,d) - t0) / 864e5);
}
function plural(n, a, b, c){ const n10=n%10, n100=n%100; return n10===1&&n100!==11 ? a : (n10>=2&&n10<=4&&(n100<10||n100>=20) ? b : c); }


const PORDER = ["draft","sent","reminded","replied"];
function applySeed(){
  const sd = D.seed; if(!sd) return;
  S.seedApplied ||= {}; const A = S.seedApplied; let ch = false;
  Object.entries(sd.dates || {}).forEach(([k,v]) => { const key = "d:"+k; if(A[key]) return; A[key] = 1; ch = true; if(!S.dates[k]) S.dates[k] = v; });
  if(sd.colleague && !A["colleague"]){ A["colleague"] = 1; ch = true;
    if(!S.colleague.name) S.colleague.name = sd.colleague.name;
    if(S.colleague.going === "unknown") S.colleague.going = sd.colleague.going; }
  Object.entries(sd.partners || {}).forEach(([id,v]) => { const key = "p:"+id+":"+v.status; if(A[key]) return; A[key] = 1; ch = true;
    const cur = S.partners[id] || (S.partners[id] = {status:"draft"});
    if(PORDER.indexOf(v.status) > PORDER.indexOf(cur.status || "draft")) cur.status = v.status;
    if(v.sent && !cur.sent) cur.sent = v.sent;
    if(v.offered && !cur.offered) cur.offered = v.offered; });
  ["housing","cars","meetings","contacts"].forEach(kind => (sd[kind] || []).forEach(item => {
    if(A[item.id]) return; A[item.id] = 1; ch = true;
    if(!S[kind].some(x => x.id === item.id)) S[kind].push({...item}); }));
  if(mergeSeedDuplicates()) ch = true;
  if(ch) ls(STATE_KEY, JSON.stringify(S));
}

// Карточка из почты (seed-…) и карточка, заведённая вручную, могут описывать одну семью
// («Foster» и «Bob & Carmen Foster – бейсмент»). Семья – по фамилии из D.partners;
// имена из partner.others (Logan Foster, David & Rebecca Hoskins) – это другие люди.
const NAME_FIELD = {housing:"host", cars:"owner", meetings:"who", contacts:"name"};
const SRANK = {idea:0, asked:1, yes:2};
function familyOf(text){
  const t = String(text || "").toLowerCase();
  const p = D.partners.find(p => t.includes(p.surname.toLowerCase()));
  if(!p || (p.others || []).some(n => t.includes(n.toLowerCase()))) return null;
  return p.id;
}
function mergeSeedDuplicates(){
  let ch = false;
  Object.entries(NAME_FIELD).forEach(([kind, nf]) => {
    S[kind].filter(x => String(x.id).startsWith("seed-")).forEach(seed => {
      const fam = familyOf(seed[nf]); if(!fam) return;
      const dups = S[kind].filter(x => x !== seed && !String(x.id).startsWith("seed-") && familyOf(x[nf]) === fam);
      if(!dups.length) return;
      const keep = dups[0];
      [seed, ...dups.slice(1)].forEach(o => mergeCard(keep, o, nf));
      S[kind] = S[kind].filter(x => x === keep || !(x === seed || dups.includes(x)));
      ch = true;
    });
  });
  return ch;
}
function mergeCard(a, b, nf){
  const okDate = v => /^20\d\d-\d\d-\d\d$/.test(v || "");
  if((b[nf] || "").length > (a[nf] || "").length) a[nf] = b[nf];
  if(b.region) a.region = b.region;
  ["from","to","date"].forEach(k => { if(k in b && !okDate(a[k]) && okDate(b[k])) a[k] = b[k]; });
  ["time","kind","referrer"].forEach(k => { if(b[k] && !a[k]) a[k] = b[k]; });
  if(b.note && !(a.note || "").includes(b.note)) a.note = a.note ? `${a.note} · ${b.note}` : b.note;
  if(a.status !== "no" && b.status && (b.status === "no" || (SRANK[b.status] ?? -1) > (SRANK[a.status] ?? -1))) a.status = b.status;
}

function issues(){
  const out = [], dt = S.dates;
  ["rva","qh"].forEach(r => { if(!dt[r+"_from"] || !dt[r+"_to"]) out.push(`Даты: ${regionName(r)}`); });
  if(!dt.depart_md || !dt.return_md) out.push("Даты рейсов туда и обратно");
  if(S.colleague.going === "unknown") out.push("Едет ли коллега в Ричмонд");
  if(!S.airport.trim()) out.push("Кто встречает в аэропорту");
  D.regions.forEach(r => {
    if(!dt[r.id+"_from"]) return;
    if(!S.housing.some(h => h.region===r.id && h.status==="yes")) out.push(`Жильё: ${r.name}`);
    if(!S.cars.some(c => c.region===r.id && c.status==="yes")) out.push(`Машина: ${r.name}`);
  });
  ["rva","qh"].forEach(r => { const n = S.contacts.filter(c => c.region===r).length; if(n < 50) out.push(`Контакты: ${regionName(r)} – ${n} из 50`); });
  return out;
}

  box.querySelectorAll(".row").forEach(el => {
    const r = S[kind].find(x => x.id === el.dataset.id);
    el.querySelectorAll("[data-k]").forEach(inp => {
      const ev = inp.tagName==="SELECT" || inp.type==="date" || inp.type==="time" ? "change" : "input";
      inp.addEventListener(ev, () => { r[inp.dataset.k] = inp.value; save();

    });
    el.querySelector("[data-del]").onclick = () => { if(!confirm("Удалить эту запись?")) return; S[kind] = S[kind].filter(x => x.id !== r.id); save(); renderRows(kind); renderIssues(); };

  if(kind==="contacts") renderMeters();
}

  let body = L.body;
  if(S.colleague.going === "no") body = body.replace(/, together with my colleague \{\{colleague\}\}/g, "");
  const parts = body.split(/(\{\{[a-z_]+\}\})/g);
  return parts.map(p => { const m = p.match(/^\{\{([a-z_]+)\}\}$/); if(!m) return forCopy ? p : esc(p);
    const v = val[m[1]]; if(v) return forCopy ? v : esc(v);
    return forCopy ? `[${label[m[1]]}]` : `<mark>${label[m[1]]}</mark>`; }).join("");
}

  <div id="lbody"></div>
  <h2>Записка для друзей партнёра</h2><p class="hint">Её партнёр пересылает своим знакомым. Впишите регион и месяц.</p>

/* ---------- Presentation ---------- */
const PST = {plan:"план", draft:"черновик", ready:"готово"};

/* ---------- Learn blurbs ---------- */
const STOP = new Set("a an the to of and or in on at for with is are was be i you we it this that my our your so as".split(" "));
let LB = null; // {id, mode:'read'|'learn', blurred:Set, done:{}, first:{}}
function hashStr(s){ let h=0; for(const c of s) h=(h*31+c.charCodeAt(0))|0; return (h>>>0).toString(36); }
function chunkBlurb(b){
  // paragraphs -> chunks split on punctuation, long chunks split into 3–6 word pieces
  return b.text.split(/\n\n+/).map((para, pi) => {
    const raw = (para.replace(/(\d)–(\d)/g, "$1\uE000$2").match(/[^,;:.!?…–]+[,;:.!?…–]*\s*/g) || [para]).map(x => x.replace(/\uE000/g, "–").trim().split(/\s+/).filter(Boolean)).filter(w => w.length);
    const isPh = w => w.length === 1 && /^\[[^\]]+\][,!?.]*$/.test(w[0]);
    const segs = [];
    raw.forEach(w => {
      const last = segs[segs.length-1];
      if(last && !isPh(last) && !isPh(w) && (last.length < 3 || w.length < 3) && last.length + w.length <= 9) last.push(...w);
      else segs.push([...w]);
    });
    const out = [];
    segs.forEach(words => {
      const n = words.length, pieces = n <= 7 ? 1 : Math.ceil(n / 5), size = Math.ceil(n / pieces);
      for(let i = 0; i < n; i += size) out.push(words.slice(i, i + size).join(" "));
    });
    return out.map((t, ci) => {
      const core = t.replace(/[,;:.!?…–]+$/,"").trim();
      const fixed = /^\[[^\]]+\][,!?.]*$/.test(t) || core.split(/\s+/).length < 2 || core.split(/\s+/).every(w => STOP.has(w.toLowerCase().replace(/[^a-z']/g,"")));
      return {id: `${b.id}:${hashStr(t)}:${pi}.${ci}`, text: t, core, fixed};
    });
  });
}
function allChunks(){ return D.blurbs.flatMap(b => chunkBlurb(b).flat()).filter(c => !c.fixed); }
const stat = id => (S.learn[id] ||= {c:0, w:0});
function weight(id){ const s = S.learn[id]; if(!s) return 1.3; return Math.max(0.12, 1 + 2*s.w - 0.6*s.c); }
function known(id){ const s = S.learn[id]; return s && s.c >= 2 && s.c >= 2*s.w + 2; }
function blurbProgress(b){ const cs = chunkBlurb(b).flat().filter(c => !c.fixed); return {n: cs.length, k: cs.filter(c => known(c.id)).length}; }
function pickBlurred(chunks){
  const pool = chunks.filter(c => !c.fixed), k = Math.max(1, Math.round(pool.length * 0.4)), out = new Set();
  const items = pool.map(c => ({c, w: weight(c.id)}));
  while(out.size < Math.min(k, items.length)){
    const left = items.filter(x => !out.has(x.c.id)), tot = left.reduce((a,x) => a + x.w, 0);
    let r = Math.random() * tot; for(const x of left){ r -= x.w; if(r <= 0){ out.add(x.c.id); break; } }
    if(r > 0) out.add(left[left.length-1].c.id);
  }
  return out;
}
function mutate(core, pool){
  const w = core.split(/\s+/);
  const idx = w.map((x,i) => i).filter(i => !STOP.has(w[i].toLowerCase()) && !/^\[/.test(w[i]));
  if(!idx.length) return null;
  const i = idx[Math.floor(Math.random()*idx.length)];
  const words = [...new Set(pool.flatMap(c => c.core.split(/\s+/)))].filter(x => !STOP.has(x.toLowerCase()) && !/^\[/.test(x) && x.toLowerCase() !== w[i].toLowerCase());
  const near = words.filter(x => Math.abs(x.length - w[i].length) <= 2);
  const src = near.length ? near : words; if(!src.length) return null;
  const nw = [...w]; nw[i] = src[Math.floor(Math.random()*src.length)]; return nw.join(" ");
}
function options(chunk){
  const pool = allChunks(), target = chunk.core.toLowerCase(), wc = chunk.core.split(/\s+/).length;
  const tw = new Set(target.split(/\s+/));
  const cand = [...new Map(pool.filter(c => c.core.toLowerCase() !== target).map(c => [c.core.toLowerCase(), c])).values()]
    .map(c => { const cw = c.core.toLowerCase().split(/\s+/); const overlap = cw.filter(x => tw.has(x) && !STOP.has(x)).length;
      return {t: c.core, s: Math.abs(cw.length - wc) - overlap*1.5 + Math.random()*1.2}; })
    .sort((a,b) => a.s - b.s).map(x => x.t);
  const set = new Set([chunk.core]);
  const m = mutate(chunk.core, pool); if(m && m.toLowerCase() !== target) set.add(m);
  for(const t of cand){ if(set.size >= 4) break; set.add(t); }
  return [...set].sort(() => Math.random() - .5);
}
function renderLearn(){
  const v = $("#v-learn"); if(!v) return;
  if(!LB){
    const groups = [...new Set(D.blurbs.map(b => b.group))];
    v.innerHTML = `<h2>Блёрбы для заучивания</h2><p class="hint">По гайду наизусть нужно знать блёрб встречи и просьбу о контактах. Выберите текст: сначала прочитайте его, потом нажмите «Учить».</p>` +
      groups.map(g => `<h3>${esc(g)}</h3><ul class="bl-list">${D.blurbs.filter(b => b.group===g).map(b => { const p = blurbProgress(b);
        return `<li><button data-b="${b.id}"><span style="flex:1"><span class="t">${esc(b.title)}</span><span class="bar"><i style="width:${p.n?p.k/p.n*100:0}%"></i></span></span><span class="pct">${p.k} из ${p.n}</span></button></li>`; }).join("")}</ul>`).join("");
    v.querySelectorAll("[data-b]").forEach(btn => btn.onclick = () => { LB = {id: btn.dataset.b, mode:"read"}; renderLearn(); window.scrollTo(0, $("nav.tabs").offsetTop); });
    closeSheet(); return;
  }
  const b = D.blurbs.find(x => x.id === LB.id), paras = chunkBlurb(b), p = blurbProgress(b);
  const learn = LB.mode === "learn";
  const html = paras.map(ps => `<p>${ps.map(c => {
    let cls = "ck";
    if(/^\[[^\]]+\]/.test(c.text) && c.fixed) cls += " ph";
    if(learn && LB.blurred.has(c.id)) cls += LB.done[c.id] ? (LB.first[c.id] ? " ok" : " bad") : " blur";
    else if(!learn && !c.fixed && S.learn[c.id] && !known(c.id) && S.learn[c.id].w > 0) cls += " weak";
    const attrs = learn && LB.blurred.has(c.id) && !LB.done[c.id] ? ` role="button" tabindex="0" aria-label="Скрытая фраза" data-ck="${c.id}"` : "";
    return `<span class="${cls}"${attrs}>${esc(c.text)}</span>`; }).join(" ")}</p>`).join("");
  const total = learn ? LB.blurred.size : 0, doneN = learn ? Object.keys(LB.done).length : 0, firstN = learn ? Object.values(LB.first).filter(Boolean).length : 0;
  v.innerHTML = `<div class="bl-head"><button class="btn small ghost" id="bl-back">Все блёрбы</button><span class="bl-score">Выучено ${p.k} из ${p.n} фраз</span></div>
    <h2>${esc(b.title)}</h2><p class="bl-note">${esc(b.note)}</p>
    <div class="bl-text">${html}</div>
    <div class="bl-bar">${learn
      ? `<button class="btn small primary" id="bl-new">Новый блюр</button><button class="btn small" id="bl-read">Читать</button><span class="bl-score">${doneN} из ${total}${doneN ? `, с первого раза ${firstN}` : ""}</span>`
      : `<button class="btn small primary" id="bl-learn">Учить</button>${p.n && Object.keys(S.learn).some(k => k.startsWith(b.id+":")) ? `<span class="bl-score">Пунктиром подчёркнуты фразы, в которых вы ошибались</span>` : ""}`}</div>`;
  $("#bl-back").onclick = () => { LB = null; renderLearn(); };
  if(learn){
    $("#bl-new").onclick = startRound; $("#bl-read").onclick = () => { LB = {id: LB.id, mode:"read"}; renderLearn(); };
    v.querySelectorAll("[data-ck]").forEach(el => { const open = () => openSheet(el.dataset.ck); el.onclick = open; el.onkeydown = e => { if(e.key==="Enter"||e.key===" "){ e.preventDefault(); open(); } }; });
    if(total && doneN === total) toast(`Раунд завершён: с первого раза ${firstN} из ${total}`);
  } else $("#bl-learn").onclick = startRound;
}
function startRound(){
  const b = D.blurbs.find(x => x.id === LB.id);
  LB = {id: b.id, mode:"learn", blurred: pickBlurred(chunkBlurb(b).flat()), done:{}, first:{}};
  closeSheet(); renderLearn();
}
function closeSheet(){ const s = document.getElementById("sheet"); if(s) s.remove(); document.querySelectorAll(".ck.active").forEach(x => x.classList.remove("active")); }
function openSheet(id){
  closeSheet();
  const b = D.blurbs.find(x => x.id === LB.id), chunk = chunkBlurb(b).flat().find(c => c.id === id);
  document.querySelector(`[data-ck="${CSS.escape(id)}"]`)?.classList.add("active");
  const opts = options(chunk); let tried = false;
  const s = document.createElement("div"); s.className = "sheet"; s.id = "sheet"; s.setAttribute("role","dialog"); s.setAttribute("aria-label","Выберите фразу");
  s.innerHTML = `<div class="wrap"><div class="q"><span>Какая фраза скрыта?</span><button class="btn small ghost" id="sh-x">Закрыть</button></div>
    <div class="opts">${opts.map((o,i) => `<button data-i="${i}">${esc(o)}</button>`).join("")}</div></div>`;
  document.body.appendChild(s);
  $("#sh-x").onclick = closeSheet;
  s.querySelectorAll("[data-i]").forEach(btn => btn.onclick = () => {
    const pick = opts[+btn.dataset.i], ok = pick === chunk.core;
    if(ok){
      btn.classList.add("right");
      if(!tried){ stat(id).c++; LB.first[id] = true; } else LB.first[id] = false;
      LB.done[id] = true; save();
      setTimeout(() => { closeSheet(); renderLearn(); }, 350);
    } else {
      btn.classList.add("wrong"); btn.disabled = true;
      if(!tried){ stat(id).w++; tried = true; save(); }
    }
  });
  s.querySelector("[data-i]").focus();
}

function updateBadges(){
  const set = (id, n) => { const el = $("#"+id); if(el){ el.textContent = n || ""; el.style.display = n ? "" : "none"; } };
  set("b-decide", issues().length);
  set("b-check", D.checklist.reduce((a,g) => a + g.items.filter(i => !S.checks[i.id]).length, 0));
  set("b-partners", D.partners.filter(p => !(S.partners[p.id] && S.partners[p.id].status && S.partners[p.id].status !== "draft")).length);
}

function exportState(){
  const blob = new Blob([JSON.stringify(S, null, 2)], {type:"application/json"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = `trip-progress-${new Date().toISOString().slice(0,10)}.json`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function importState(e){
  const f = e.target.files[0]; if(!f) return;
  f.text().then(t => { const s = JSON.parse(t); if(!s || typeof s !== "object" || !("checks" in s)) throw 0;
    if(!confirm("Заменить текущие данные загруженной копией?")) return;
    S = Object.assign(defaults(), s); applySeed(); save(); renderDecide(); renderCheck(); renderPartners(); renderLetter(); toast("Копия загружена"); })
   .catch(() => toast("Это не файл копии данных"));
  e.target.value = "";
}
