<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Подготовка к поездке</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;650;750&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F6F2; --surface:#FFFFFF; --ink:#18212B; --muted:#5B6672; --line:#D9DDD6;
  --accent:#0B4EA2; --accent-ink:#FFFFFF; --gold:#E9B400; --open:#A86200; --open-bg:#FFF3DF;
  --done:#2E7D4F; --done-bg:#E6F3EB; --no:#A23B2E;
  --ui:"Onest", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --serif:"Literata", Georgia, "Times New Roman", serif;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#10151B; --surface:#18202A; --ink:#E7EBEF; --muted:#9AA5B1; --line:#2A3440;
    --accent:#6FA3EE; --accent-ink:#0C1520; --gold:#F2C94C; --open:#F0A23B; --open-bg:#2E2414;
    --done:#5FBF85; --done-bg:#16291F; --no:#E07B6C;
    color-scheme: dark;
  }
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--ui);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:780px;margin:0 auto;padding:0 18px}

/* Lock screen */
.lock{min-height:100vh;display:grid;place-items:center;padding:24px}
.lock form{width:100%;max-width:360px}
.lock h1{font-size:26px;line-height:1.2;font-weight:750;margin:0 0 6px}
.lock p{color:var(--muted);margin:0 0 20px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field span{font-size:14px;color:var(--muted)}
input[type=text],input[type=password],input[type=date],input[type=time],select,textarea{
  width:100%;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
textarea{min-height:70px;resize:vertical}
.check-inline{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted);margin:4px 0 16px}
.btn{text-decoration:none;display:inline-block;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:5px 10px;font-size:14px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.err{color:var(--no);font-size:14px;min-height:20px}

/* Header + route */
header.top{padding:28px 0 8px}
header.top h1{font-size:30px;line-height:1.15;font-weight:750;letter-spacing:-.01em;margin:0}
header.top .sub{color:var(--muted);margin-top:4px}
.route{margin:22px -18px 6px;padding:6px 18px 14px;overflow-x:auto;scrollbar-width:none}
.route::-webkit-scrollbar{display:none}
.route ol{list-style:none;margin:0;padding:0;display:flex;min-width:640px;position:relative}
.route ol::before{content:"";position:absolute;left:12px;right:12px;top:11px;border-top:3px solid var(--ink);opacity:.85}
.route li{flex:1;position:relative;padding-top:32px;padding-right:8px}
.route li::before{content:"";position:absolute;left:2px;top:1px;width:20px;height:20px;border-radius:50%;
  background:var(--gold);border:3px solid var(--ink)}
.route li.unset::before{background:var(--bg);border:3px dashed var(--open)}
.route li.home::before{background:var(--ink)}
.route .stop{font-weight:650;line-height:1.2}
.route .when{font-size:14px;color:var(--muted)}
.route li.unset .when{color:var(--open);font-weight:500}
.route .tz{font-size:13px;color:var(--muted)}
.count{display:flex;flex-wrap:wrap;gap:8px 22px;margin:8px 0 4px;font-size:15px}
.count b{font-weight:750;font-size:20px;margin-right:4px}
.count .past{color:var(--muted);text-decoration:line-through}

/* Tabs */
nav.tabs{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin-top:14px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-top:env(safe-area-inset-top,0px)}
nav.tabs .wrap::-webkit-scrollbar{display:none}
nav.tabs button{border:0;background:none;padding:13px 10px 11px;border-bottom:3px solid transparent;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
nav.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs .badge{display:inline-block;min-width:20px;padding:0 6px;margin-left:4px;border-radius:10px;background:var(--open-bg);color:var(--open);font-size:12px;font-weight:650;line-height:20px;text-align:center}

main{padding:22px 0 60px}
section.view{display:none}
section.view.on{display:block}
h2{font-size:21px;line-height:1.25;font-weight:750;margin:30px 0 10px}
h2:first-child{margin-top:4px}
h3{font-size:17px;font-weight:650;margin:22px 0 8px}
.hint{color:var(--muted);font-size:14px;margin:-4px 0 12px}

/* Open issues */
.issues{list-style:none;margin:0 0 8px;padding:0;border-left:3px solid var(--open);background:var(--open-bg);border-radius:0 8px 8px 0}
.issues li{padding:8px 14px;color:var(--ink)}
.issues li+li{border-top:1px solid color-mix(in srgb,var(--open) 22%,transparent)}
.issues.clear{border-left-color:var(--done);background:var(--done-bg)}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
.regblock{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.regblock .name{font-weight:650;margin-bottom:6px}

/* Row lists */
.rows{display:flex;flex-direction:column;gap:8px}
.row{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.row .rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.row .foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:8px}
.row .calc{font-size:14px;color:var(--muted)}
.row.s-yes{border-left:4px solid var(--done)}
.row.s-no{border-left:4px solid var(--no);opacity:.8}
.row.s-asked,.row.s-idea{border-left:4px solid var(--open)}
.addbar{margin-top:8px}
.meter{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:4px 0 2px}
.meter i{display:block;height:100%;background:var(--accent)}
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:14px}
.meters .lbl{font-size:14px;display:flex;justify-content:space-between}

/* Checklist */
.group{margin-bottom:22px}
.group .ghead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.group .ghead h3{margin:0 0 6px}
.group .ghead span{font-size:14px;color:var(--muted);white-space:nowrap}
.items{list-style:none;margin:0;padding:0}
.items li{border-top:1px solid var(--line)}
.items label{display:flex;gap:12px;padding:10px 2px;cursor:pointer;align-items:flex-start}
.items input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--done)}
.items input:checked+span{color:var(--muted);text-decoration:line-through}

/* Partners */
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px}
.pcard .ph{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.pcard .pn{font-weight:650;font-size:17px}
.pcard .pp{color:var(--muted);font-size:14px}
.pcard .hist{margin:8px 0;font-size:15px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.tag{font-size:13px;border:1px solid var(--line);border-radius:12px;padding:1px 9px}
.steps{display:flex;gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;width:max-content;max-width:100%;flex-wrap:wrap}
.steps button{border:0;background:var(--surface);padding:6px 11px;font-size:14px;cursor:pointer;border-right:1px solid var(--line)}
.steps button:last-child{border-right:0}
.steps button.on{background:var(--accent);color:var(--accent-ink);font-weight:650}
.wave2{list-style:none;padding:0;margin:0}
.wave2 li{padding:9px 0;border-top:1px solid var(--line)}
.wave2 .pp{color:var(--muted);font-size:14px}

/* Letters */
.lpick{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.lpick button{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:5px 12px;cursor:pointer;font-size:14px}
.lpick button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.letter{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:22px 22px 26px;font:400 16.5px/1.65 var(--serif);white-space:pre-wrap;max-width:68ch}
.letter .subj{font:600 15px/1.4 var(--ui);color:var(--muted);margin-bottom:14px;white-space:normal}
.letter mark{background:var(--open-bg);color:var(--open);font-family:var(--ui);font-size:14px;padding:1px 4px;border-radius:3px}
.lactions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.note-sample{border-left:3px solid var(--line);padding:4px 14px;font-family:var(--serif);color:var(--muted)}

/* Advice */
.advice{list-style:none;padding:0;margin:0}
.advice li{padding:12px 0;border-top:1px solid var(--line)}
.advice b{display:block;font-weight:650;margin-bottom:2px}

footer.tools{border-top:1px solid var(--line);padding:18px 0 40px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--muted);font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div id="lock" class="lock">
  <form id="lockform" autocomplete="off">
    <h1>Подготовка к поездке</h1>
    <p>Страница зашифрована. Введите токен, чтобы открыть её.</p>
    <label class="field"><span>Токен</span><input id="tok" type="password" autocomplete="current-password" required></label>
    <label class="check-inline"><input id="remember" type="checkbox"> Запомнить на этом устройстве</label>
    <button class="btn primary" type="submit">Открыть</button>
    <div class="err" id="lockerr" role="alert"></div>
  </form>
</div>
<div id="app" hidden></div>
<div class="toast" id="toast" role="status"></div>

const TOKEN_KEY = "trip2027:token";
const STATE_KEY = "trip2027:state";

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decrypt(token){
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey("raw", enc.encode(token), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    {name:"PBKDF2", salt:b64(PAYLOAD.salt), iterations:PAYLOAD.iter, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(PAYLOAD.iv)}, key, b64(PAYLOAD.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}
function ls(k, v){ try{ if(v===undefined) return localStorage.getItem(k); if(v===null) localStorage.removeItem(k); else localStorage.setItem(k, v);}catch(e){ return null; } }

async function unlock(token, remember){
  try{
    const data = await decrypt(token);
    if(remember) ls(TOKEN_KEY, token);
    document.getElementById("lock").hidden = true;
    start(data);
    return true;
  }catch(e){ return false; }
}

(async function boot(){
  const m = location.hash.match(/k=([^&]+)/);
  if(m){
    const t = decodeURIComponent(m[1]);
    history.replaceState(null, "", location.pathname + location.search);
    if(await unlock(t, true)) return;
  }
  const saved = ls(TOKEN_KEY);
  if(saved && await unlock(saved, false)) return;
  if(saved) ls(TOKEN_KEY, null);
  document.getElementById("lockform").addEventListener("submit", async e => {
    e.preventDefault();
    const ok = await unlock(document.getElementById("tok").value.trim(), document.getElementById("remember").checked);
    if(!ok) document.getElementById("lockerr").textContent = "Токен не подошёл. Проверьте его и попробуйте ещё раз.";
  });
})();

/* wall time in a zone -> Chisinau wall time */
function tzOffsetMin(zone, utcMs){
  const f = new Intl.DateTimeFormat("en-US",{timeZone:zone,hourCycle:"h23",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"});
  const p = Object.fromEntries(f.formatToParts(new Date(utcMs)).map(x=>[x.type,x.value]));
  return (Date.UTC(+p.year, +p.month-1, +p.day, +p.hour, +p.minute) - utcMs) / 60000;
}
function toChisinau(dateIso, time, zone){
  if(!dateIso || !time || !zone) return "";
  const [y,m,d] = dateIso.split("-").map(Number), [h,mi] = time.split(":").map(Number);
  let utc = Date.UTC(y,m-1,d,h,mi);
  utc -= tzOffsetMin(zone, utc) * 60000;
  utc = Date.UTC(y,m-1,d,h,mi) - tzOffsetMin(zone, utc) * 60000;
  return new Date(utc).toLocaleString("ru-RU",{timeZone:"Europe/Chisinau",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
}
function daysTo(iso){
  const now = new Date(); const t0 = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
  const [y,m,d] = iso.split("-").map(Number); return Math.round((Date.UTC(y,m-1,d) - t0) / 864e5);
}
function plural(n, a, b, c){ const n10=n%10, n100=n%100; return n10===1&&n100!==11 ? a : (n10>=2&&n10<=4&&(n100<10||n100>=20) ? b : c); }

function show(v, fromHash){
  document.querySelectorAll("section.view").forEach(s => s.classList.toggle("on", s.id === "v-"+v));
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.v === v));
  if(!fromHash){ history.replaceState(null, "", "#"+v);
    const nav = document.querySelector("nav.tabs"); if(nav.getBoundingClientRect().top <= 0) window.scrollTo(0, nav.offsetTop); }
  if(v === "letters") renderLetter();
}

function renderRoute(){
  const dt = S.dates, rng = (a,b) => a||b ? `${ruDate(a)||"?"} – ${ruDate(b)||"?"}` : "";
  const stops = [
    {stop:"Кишинёв", when: ruDate(dt.depart_md) || "4 янв.", home:true},
    ...D.regions.map(r => ({stop:r.name, when: rng(dt[r.id+"_from"], dt[r.id+"_to"]), tz: r.tz==="America/New_York" ? "−7 ч" : "−8 ч"})),
    {stop:"Кишинёв", when: ruDate(dt.return_md) || "", home:true}
  ];
  $("#route").innerHTML = `<ol>${stops.map(s => `<li class="${s.home?"home":""} ${!s.when?"unset":""}">
    <div class="stop">${esc(s.stop)}</div><div class="when">${esc(s.when || "даты?")}</div>${s.tz?`<div class="tz">${s.tz}</div>`:""}</li>`).join("")}</ol>`;
  $("#count").innerHTML = D.milestones.map(m => { const n = daysTo(m.date);
    return n < 0 ? `<span class="past">${esc(m.label)}</span>` : `<span><b>${n===0?"сегодня":n}</b>${n===0?"":plural(n,"день","дня","дней")} – ${esc(m.label)}</span>`; }).join("");
}

/* ---------- Decisions ---------- */
const STATUS = {idea:"Идея", asked:"Спросил", yes:"Да", no:"Нет"};
const CSTATUS = {new:"Получен", written:"Написал", called:"Позвонил", meeting:"Встреча назначена", partner:"Стал партнёром", no:"Отказ"};
function issues(){
  const out = [], dt = S.dates;
  ["rva","qh"].forEach(r => { if(!dt[r+"_from"] || !dt[r+"_to"]) out.push(`Даты: ${regionName(r)}`); });
  if(!dt.depart_md || !dt.return_md) out.push("Даты рейсов туда и обратно");
  if(S.colleague.going === "unknown") out.push("Едет ли коллега в Ричмонд");
  if(!S.airport.trim()) out.push("Кто встречает в аэропорту");
  D.regions.forEach(r => {
    if(!dt[r.id+"_from"]) return;
    if(!S.housing.some(h => h.region===r.id && h.status==="yes")) out.push(`Жильё: ${r.name}`);
    if(!S.cars.some(c => c.region===r.id && c.status==="yes")) out.push(`Машина: ${r.name}`);
  });
  ["rva","qh"].forEach(r => { const n = S.contacts.filter(c => c.region===r).length; if(n < 50) out.push(`Контакты: ${regionName(r)} – ${n} из 50`); });
  return out;
}
function dateField(key, label){ return `<label class="field"><span>${label}</span><input type="date" data-date="${key}" value="${esc(S.dates[key]||"")}"></label>`; }
function regionOptions(sel){ return D.regions.map(r => `<option value="${r.id}" ${r.id===sel?"selected":""}>${esc(r.name)}</option>`).join(""); }
function opts(map, sel){ return Object.entries(map).map(([k,v]) => `<option value="${k}" ${k===sel?"selected":""}>${v}</option>`).join(""); }

function renderDecide(){
  const v = $("#v-decide");
  v.innerHTML = `
  <h2>Что ещё не решено</h2><div id="issues"></div>
  <h2>Даты</h2>
  <div class="grid2">${dateField("depart_md","Вылет из Кишинёва")}${dateField("return_md","Возвращение")}</div>
  ${D.regions.map(r => `<div class="regblock"><div class="name">${esc(r.name)}, ${esc(r.state)}</div>
    <div class="grid2">${dateField(r.id+"_from","С")}${dateField(r.id+"_to","По")}</div></div>`).join("")}
  <h2>Коллега и аэропорт</h2>
  <div class="grid2">
    <label class="field"><span>Имя коллеги</span><input type="text" id="col-name" value="${esc(S.colleague.name)}"></label>
    <label class="field"><span>Едет в Ричмонд?</span><select id="col-going">${opts({unknown:"Пока неизвестно",yes:"Да",no:"Нет"}, S.colleague.going)}</select></label>
  </div>
  <label class="field"><span>Кто встречает в аэропорту</span><input type="text" id="airport" value="${esc(S.airport)}" placeholder="Имя, телефон, рейс"></label>
  <h2>Жильё</h2><p class="hint">Гайд советует менять семью каждые 7–10 дней.</p><div class="rows" id="housing"></div>
  <div class="addbar"><button class="btn small" data-add="housing">Добавить вариант жилья</button></div>
  <h2>Машина</h2><div class="rows" id="cars"></div>
  <div class="addbar"><button class="btn small" data-add="cars">Добавить вариант машины</button></div>
  <h2>Встречи</h2><p class="hint">Время вводите местное – рядом появится время в Кишинёве.</p><div class="rows" id="meetings"></div>
  <div class="addbar"><button class="btn small" data-add="meetings">Добавить встречу</button></div>
  <h2>Контакты</h2><p class="hint">Цель гайда – минимум 50 контактов на регион.</p>
  <div class="meters" id="meters"></div><div class="rows" id="contacts"></div>
  <div class="addbar"><button class="btn small" data-add="contacts">Добавить контакт</button></div>
  <h2>Заметки</h2><textarea id="notes" rows="5">${esc(S.notes)}</textarea>`;
  v.querySelectorAll("[data-date]").forEach(i => i.onchange = () => { S.dates[i.dataset.date] = i.value; save(); renderIssues(); });
  $("#col-name").oninput = e => { S.colleague.name = e.target.value; save(); };
  $("#col-going").onchange = e => { S.colleague.going = e.target.value; save(); renderIssues(); };
  $("#airport").oninput = e => { S.airport = e.target.value; save(); renderIssues(); };
  $("#notes").oninput = e => { S.notes = e.target.value; save(); };
  v.querySelectorAll("[data-add]").forEach(b => b.onclick = () => { addRow(b.dataset.add); });
  ["housing","cars","meetings","contacts"].forEach(renderRows); renderIssues();
}
function renderIssues(){
  const list = issues();
  $("#issues").innerHTML = list.length
    ? `<ul class="issues">${list.map(t => `<li>${esc(t)}</li>`).join("")}</ul>`
    : `<ul class="issues clear"><li>Все контрольные точки решены.</li></ul>`;
  updateBadges();
}
function addRow(kind){
  const base = {id:uid(), region:"rva", note:""};
  const row = kind==="housing" ? {...base, host:"", from:"", to:"", status:"idea"}
    : kind==="cars" ? {...base, owner:"", from:"", to:"", status:"idea"}
    : kind==="meetings" ? {...base, date:"", time:"", who:"", kind:""}
    : {...base, name:"", referrer:"", status:"new"};
  S[kind].push(row); save(); renderRows(kind); renderIssues();
  const el = document.querySelector(`#${kind} .row:last-child input[type=text]`); if(el) el.focus();
}
function rowHtml(kind, r){
  const reg = `<label class="field"><span>Регион</span><select data-k="region">${regionOptions(r.region)}</select></label>`;
  const txt = (k, label, ph="") => `<label class="field"><span>${label}</span><input type="text" data-k="${k}" value="${esc(r[k])}" placeholder="${ph}"></label>`;
  const dat = (k, label) => `<label class="field"><span>${label}</span><input type="date" data-k="${k}" value="${esc(r[k])}"></label>`;
  let inner = "", calc = "";
  if(kind==="housing") inner = txt("host","У кого")+reg+dat("from","С")+dat("to","По")+`<label class="field"><span>Статус</span><select data-k="status">${opts(STATUS,r.status)}</select></label>`;
  if(kind==="cars") inner = txt("owner","Чья машина")+reg+dat("from","С")+dat("to","По")+`<label class="field"><span>Статус</span><select data-k="status">${opts(STATUS,r.status)}</select></label>`;
  if(kind==="meetings"){ inner = txt("who","С кем")+txt("kind","Что","встреча, класс, ужин")+reg+dat("date","Дата")+`<label class="field"><span>Время (местное)</span><input type="time" data-k="time" value="${esc(r.time)}"></label>`;
    const ch = toChisinau(r.date, r.time, regionTz(r.region)); calc = ch ? `В Кишинёве: ${ch}` : ""; }
  if(kind==="contacts") inner = txt("name","Имя")+txt("referrer","От кого")+reg+`<label class="field"><span>Статус</span><select data-k="status">${opts(CSTATUS,r.status)}</select></label>`;
  const st = r.status && kind!=="contacts" ? " s-"+r.status : "";
  return `<div class="row${st}" data-id="${r.id}"><div class="rgrid">${inner}</div>
    <label class="field" style="margin:8px 0 0"><span>Заметка</span><input type="text" data-k="note" value="${esc(r.note)}"></label>
    <div class="foot"><span class="calc">${esc(calc)}</span><button class="btn small ghost" data-del>Удалить</button></div></div>`;
}
function renderRows(kind){
  const box = $("#"+kind); if(!box) return;
  const list = kind==="meetings" ? [...S[kind]].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)) : S[kind];
  box.innerHTML = list.length ? list.map(r => rowHtml(kind, r)).join("") : `<p class="hint" style="margin:0">Пока пусто.</p>`;
  box.querySelectorAll(".row").forEach(el => {
    const r = S[kind].find(x => x.id === el.dataset.id);
    el.querySelectorAll("[data-k]").forEach(inp => {
      const ev = inp.tagName==="SELECT" || inp.type==="date" || inp.type==="time" ? "change" : "input";
      inp.addEventListener(ev, () => { r[inp.dataset.k] = inp.value; save();
        if(ev==="change"){ renderRows(kind); renderIssues(); } });
    });
    el.querySelector("[data-del]").onclick = () => { if(!confirm("Удалить эту запись?")) return; S[kind] = S[kind].filter(x => x.id !== r.id); save(); renderRows(kind); renderIssues(); };
  });
  if(kind==="contacts") renderMeters();
}
function renderMeters(){
  $("#meters").innerHTML = D.regions.map(r => { const n = S.contacts.filter(c => c.region===r.id).length, goal = (r.id==="rva"||r.id==="qh") ? 50 : 15;
    return `<div><div class="lbl"><span>${esc(r.name)}</span><span>${n} из ${goal}</span></div><div class="meter"><i style="width:${Math.min(100, n/goal*100)}%"></i></div></div>`; }).join("");
}

/* ---------- Checklist ---------- */
function renderCheck(){
  $("#v-check").innerHTML = D.checklist.map(g => `<div class="group"><div class="ghead"><h3>${esc(g.group)}</h3><span data-gc="${esc(g.group)}"></span></div>
    <ul class="items">${g.items.map(i => `<li><label><input type="checkbox" data-c="${i.id}" ${S.checks[i.id]?"checked":""}><span>${esc(i.text)}</span></label></li>`).join("")}</ul></div>`).join("");
  $("#v-check").querySelectorAll("[data-c]").forEach(c => c.onchange = () => { S.checks[c.dataset.c] = c.checked; save(); groupCounts(); });
  groupCounts();
}
function groupCounts(){
  D.checklist.forEach(g => { const done = g.items.filter(i => S.checks[i.id]).length;
    const el = document.querySelector(`[data-gc="${CSS.escape(g.group)}"]`); if(el) el.textContent = `${done} из ${g.items.length}`; });
}

/* ---------- Partners ---------- */
const PSTEPS = {draft:"Черновик", sent:"Отправлено", reminded:"Напомнил", replied:"Ответил"};
function renderPartners(){
  $("#v-partners").innerHTML = `<h2>Первая волна</h2>
  ${D.partners.map(p => { const st = S.partners[p.id] || {};
    return `<div class="pcard" data-p="${p.id}">
      <div class="ph"><span class="pn">${esc(p.name)}</span><span class="pp">${esc(p.place)}</span></div>
      <div class="hist">${esc(p.history)}</div>
      <div class="tags">${p.asks.map(a => `<span class="tag">${esc(a)}</span>`).join("")}</div>
      <div class="steps" role="group" aria-label="Статус письма">${Object.entries(PSTEPS).map(([k,v]) => `<button data-s="${k}" class="${(st.status||"draft")===k?"on":""}">${v}</button>`).join("")}</div>
      <div class="grid2" style="margin-top:10px">
        <label class="field"><span>Дата отправки</span><input type="date" data-pf="sent" value="${esc(st.sent||"")}"></label>
        <label class="field"><span>Что предложили</span><input type="text" data-pf="offered" value="${esc(st.offered||"")}"></label>
      </div>
      <div class="lactions"><button class="btn small" data-open-letter="${p.letter}">Открыть письмо</button></div>
    </div>`; }).join("")}
  <h2>Вторая волна</h2>
  <ul class="wave2">${D.secondWave.map(w => `<li><b>${esc(w.name)}</b> <span class="pp">${esc(w.place)}</span><div>${esc(w.note)}</div></li>`).join("")}</ul>`;
  document.querySelectorAll(".pcard").forEach(card => {
    const id = card.dataset.p; const st = () => (S.partners[id] = S.partners[id] || {status:"draft"});
    card.querySelectorAll("[data-s]").forEach(b => b.onclick = () => { st().status = b.dataset.s;
      if(b.dataset.s==="sent" && !st().sent){ st().sent = new Date().toISOString().slice(0,10); card.querySelector('[data-pf="sent"]').value = st().sent; }
      card.querySelectorAll("[data-s]").forEach(x => x.classList.toggle("on", x===b)); save(); });
    card.querySelectorAll("[data-pf]").forEach(i => i.addEventListener(i.type==="date"?"change":"input", () => { st()[i.dataset.pf] = i.value; save(); }));
    card.querySelector("[data-open-letter]").onclick = e => { curLetter = e.target.dataset.openLetter; show("letters"); window.scrollTo(0,0); };
  });
}

/* ---------- Letters ---------- */
let curLetter = "foster";
function fillLetter(key, forCopy){
  const L = D.letters[key], dt = S.dates;
  const val = {
    rva_from: enDate(dt.rva_from), rva_to: enDate(dt.rva_to), qh_from: enDate(dt.qh_from), qh_to: enDate(dt.qh_to),
    stl_from: enDate(dt.stl_from), stl_to: enDate(dt.stl_to), colleague: S.colleague.name,
    intro: D.introNote.replace("{{area}}", L.area||"").replace("{{month}}", L.month||"")
  };
  const label = {rva_from:"дата начала, Ричмонд", rva_to:"дата конца, Ричмонд", qh_from:"дата начала, Куинси", qh_to:"дата конца, Куинси",
    stl_from:"дата начала, Сент-Луис", stl_to:"дата конца, Сент-Луис", colleague:"имя коллеги"};
  let body = L.body;
  if(S.colleague.going === "no") body = body.replace(/, together with my colleague \{\{colleague\}\}/g, "");
  const parts = body.split(/(\{\{[a-z_]+\}\})/g);
  return parts.map(p => { const m = p.match(/^\{\{([a-z_]+)\}\}$/); if(!m) return forCopy ? p : esc(p);
    const v = val[m[1]]; if(v) return forCopy ? v : esc(v);
    return forCopy ? `[${label[m[1]]}]` : `<mark>${label[m[1]]}</mark>`; }).join("");
}
function renderLetters(){
  $("#v-letters").innerHTML = `<div class="lpick" id="lpick">${D.partners.map(p => `<button data-l="${p.letter}">${esc(p.surname)}</button>`).join("")}</div>
  <div id="lbody"></div>
  <h2>Записка для друзей партнёра</h2><p class="hint">Её партнёр пересылает своим знакомым. Впишите регион и месяц.</p>
  <div class="note-sample">${esc(D.introNote.replace("{{area}}","[area]").replace("{{month}}","[month]"))}</div>`;
  $("#lpick").querySelectorAll("[data-l]").forEach(b => b.onclick = () => { curLetter = b.dataset.l; renderLetter(); });
}
function renderLetter(){
  const L = D.letters[curLetter], p = D.partners.find(x => x.letter === curLetter);
  $("#lpick").querySelectorAll("[data-l]").forEach(b => b.classList.toggle("on", b.dataset.l === curLetter));
  const missing = /<mark>/.test(fillLetter(curLetter, false));
  $("#lbody").innerHTML = `<div class="letter"><div class="subj">Subject: ${esc(L.subject)}</div>${fillLetter(curLetter, false)}</div>
  <div class="lactions"><button class="btn small primary" id="copy">Скопировать текст</button>
  <a class="btn small" id="mail" href="#">Открыть в почте</a></div>
  ${missing ? `<p class="hint">Выделенные места заполнятся сами, когда вы впишете даты и имя коллеги в разделе «Решения».</p>` : ""}`;
  $("#copy").onclick = async () => { try{ await navigator.clipboard.writeText(fillLetter(curLetter, true)); toast("Текст скопирован"); }catch(e){ toast("Не удалось скопировать – выделите текст вручную"); } };
  $("#mail").href = `mailto:${p.emails.join(",")}?subject=${encodeURIComponent(L.subject)}&body=${encodeURIComponent(fillLetter(curLetter, true))}`;
}

/* ---------- Advice ---------- */
function renderAdvice(){
  $("#v-advice").innerHTML = `<h2>Рекомендации</h2><ul class="advice">${D.advice.map(a => `<li><b>${esc(a.title)}</b>${esc(a.text)}</li>`).join("")}</ul>`;
}

function updateBadges(){
  const set = (id, n) => { const el = $("#"+id); if(el){ el.textContent = n || ""; el.style.display = n ? "" : "none"; } };
  set("b-decide", issues().length);
  set("b-check", D.checklist.reduce((a,g) => a + g.items.filter(i => !S.checks[i.id]).length, 0));
  set("b-partners", D.partners.filter(p => !(S.partners[p.id] && S.partners[p.id].status && S.partners[p.id].status !== "draft")).length);
}

function exportState(){
  const blob = new Blob([JSON.stringify(S, null, 2)], {type:"application/json"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = `trip-progress-${new Date().toISOString().slice(0,10)}.json`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function importState(e){
  const f = e.target.files[0]; if(!f) return;
  f.text().then(t => { const s = JSON.parse(t); if(!s || typeof s !== "object" || !("checks" in s)) throw 0;
    if(!confirm("Заменить текущие данные загруженной копией?")) return;
    S = Object.assign(defaults(), s); save(); renderDecide(); renderCheck(); renderPartners(); renderLetter(); toast("Копия загружена"); })
   .catch(() => toast("Это не файл копии данных"));
  e.target.value = "";
}
</script>
</body>
</html>
